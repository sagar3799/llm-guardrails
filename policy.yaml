# category -> {severity -> action}. severity is a pure model output (see
# src/guardrails/middleware.py::_severity_from_score); this file is the only place
# business policy lives — retune it without touching any code.
#
# pii is intentionally anonymize at HIGH severity, not block: the entire point of
# Phase 2.5 is to redact confidently-detected PII rather than reject the request
# outright. A high-confidence email match is exactly the case anonymization exists for.
prompt_injection:
  high: block
  medium: block
  low: warn
jailbreak:
  high: block
  medium: block
  low: warn
pii:
  high: anonymize
  medium: anonymize
  low: warn
toxicity:
  high: block
  medium: warn
  low: allow
