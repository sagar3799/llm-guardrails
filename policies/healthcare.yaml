# Healthcare-oriented policy pack: PII is hard-blocked, not anonymized, at every
# severity. Regulatory contexts (HIPAA-style) often can't tolerate any placeholder-PII
# round-trip risk, so the tradeoff favors rejecting the request outright over redacting
# and continuing — the opposite call from the default policy.yaml's pii row, which
# anonymizes. Load with get_policy_engine("healthcare") or
# GuardrailsEngine(policy_name="healthcare").
prompt_injection:
  high: block
  medium: block
  low: warn
jailbreak:
  high: block
  medium: block
  low: warn
pii:
  high: block
  medium: block
  low: block
toxicity:
  high: block
  medium: warn
  low: allow
