<svg font-family="-apple-system-body, ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Helvetica, &quot;Apple Color Emoji&quot;, Arial, sans-serif, &quot;Segoe UI Emoji&quot;, &quot;Segoe UI Symbol&quot;" font-weight="400" data-d-component="svg" fill="currentColor" stroke-linecap="round" stroke-linejoin="round" style="color:rgb(255, 255, 255)" viewBox="0 0 720 520" width="100%" xmlns="http://www.w3.org/2000/svg"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#CBD5E1"/></marker></defs><rect width="720" height="520" rx="18" fill="#0B1220"/><rect x="210" y="20" width="300" height="42" rx="10" fill="#2563EB"/><text x="360" y="38" font-size="16" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF">LLM Guardrails Engine</text><text x="360" y="52" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#DBEAFE">Pluggable, local-only LLM safety middleware</text><rect x="30" y="95" width="290" height="155" rx="14" fill="#111827" stroke="#2563EB" stroke-width="1.5"/><rect x="45" y="108" width="260" height="28" rx="8" fill="#2563EB"/><text x="175" y="126" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF">Input Guardrails</text><rect x="50" y="145" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="62" cy="154" r="3" fill="#60A5FA"/><text x="72" y="157" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Prompt Injection / Jailbreak</text><text x="288" y="157" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">ONNX + Regex</text><rect x="50" y="169" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="62" cy="178" r="3" fill="#60A5FA"/><text x="72" y="181" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">PII Detection</text><text x="288" y="181" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Presidio</text><rect x="50" y="193" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="62" cy="202" r="3" fill="#60A5FA"/><text x="72" y="205" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Secret / API Keys</text><text x="288" y="205" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Regex</text><rect x="50" y="217" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="62" cy="226" r="3" fill="#60A5FA"/><text x="72" y="229" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Custom detectors (pluggable)</text><text x="288" y="229" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Detector protocol</text><rect x="400" y="95" width="290" height="155" rx="14" fill="#111827" stroke="#059669" stroke-width="1.5"/><rect x="415" y="108" width="260" height="28" rx="8" fill="#059669"/><text x="545" y="126" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF">Output Guardrails</text><rect x="420" y="145" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="432" cy="154" r="3" fill="#34D399"/><text x="442" y="157" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Toxicity Detection</text><text x="658" y="157" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">ONNX</text><rect x="420" y="169" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="432" cy="178" r="3" fill="#34D399"/><text x="442" y="181" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">PII Leak Detection</text><text x="658" y="181" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Presidio</text><rect x="420" y="193" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="432" cy="202" r="3" fill="#34D399"/><text x="442" y="205" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Secret Leak Detection</text><text x="658" y="205" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Regex</text><rect x="420" y="217" width="250" height="18" rx="6" fill="#1F2937"/><circle cx="432" cy="226" r="3" fill="#34D399"/><text x="442" y="229" font-size="9" font-family="Arial, Helvetica, sans-serif" fill="#E5E7EB">Streaming Validation</text><text x="658" y="229" font-size="7" text-anchor="end" font-family="Arial, Helvetica, sans-serif" fill="#9CA3AF">Sliding Window</text><path d="M175 250 V278" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M545 250 V278" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="160" y="290" width="400" height="78" rx="14" fill="#7C3AED"/><text x="360" y="312" font-size="14" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#FFFFFF">Policy Engine</text><text x="360" y="327" font-size="9" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" fill="#F3E8FF">category → severity → action</text><g font-family="Arial, Helvetica, sans-serif" font-size="8" fill="#FFFFFF"><text x="185" y="345">Injection → HIGH → BLOCK</text><text x="185" y="357">PII → MEDIUM → ANONYMIZE</text><text x="385" y="345">Toxicity → MEDIUM → WARN</text><text x="385" y="357">No match → n/a → ALLOW</text></g><path d="M360 368 V390" stroke="#94A3B8" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="120" y="400" width="480" height="95" rx="14" fill="#111827" stroke="#374151"/><text x="360" y="420" font-size="13" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="bold" fill="#F9FAFB">GuardResult (Structured Decision)</text><g font-family="Arial, Helvetica, sans-serif" font-size="9" fill="#D1D5DB"><text x="145" y="440">✓ allowed</text><text x="145" y="454">✓ action</text><text x="145" y="468">✓ severity</text><text x="145" y="482">✓ risk_score</text><text x="360" y="440">✓ categories</text><text x="360" y="454">✓ matched_rules</text><text x="360" y="468">✓ sanitized_text</text><text x="360" y="482">✓ latency_ms (logged)</text></g></svg>
